<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="Explore new ideas in a rotatable world of refractive glass.">
  <title>Design World — Explore New Ideas</title>
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
      }
    }
  </script>
  <style>
    :root {
      --bg: #000;
      --fg: #fff;
      --pad-x: clamp(20px, 6.95vw, 120px);
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
      color: #fff;
      font-family: 'Poppins', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body { min-width: 0; }
    a, button { font: inherit; }
    button { padding: 0; }

    .hero {
      position: relative;
      width: 100%;
      height: 100vh;
      height: 100svh;
      min-height: 520px;
      overflow: hidden;
      background: #000;
    }

    #scene {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      cursor: grab;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    #scene.dragging { cursor: grabbing; }

    .ui {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
    }

    .ui a, .ui button { pointer-events: auto; }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
      border: 0;
    }

    .nav {
      position: absolute;
      top: clamp(24px, 4.7vh, 40px);
      left: var(--pad-x);
      right: var(--pad-x);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #fff;
      text-decoration: none;
      font-size: 15px;
      letter-spacing: -0.01em;
    }

    .logo-mark {
      width: 20px;
      height: 40px;
      flex: none;
      background: #fff;
      border-radius: 0 20px 20px 0;
    }

    .logo b { font-weight: 700; }
    .logo span { font-weight: 400; }

    .nav-links {
      display: flex;
      gap: clamp(20px, 4.1vw, 60px);
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .nav-links a {
      position: relative;
      color: #fff;
      text-decoration: none;
      font-size: 15px;
      font-weight: 500;
    }

    .nav-links a::after {
      content: '';
      position: absolute;
      left: 0;
      right: 0;
      bottom: -4px;
      height: 1px;
      background: currentColor;
      transform: scaleX(0);
      transform-origin: right;
      transition: transform .35s ease;
    }

    .nav-links a:hover::after,
    .nav-links a:focus-visible::after {
      transform: scaleX(1);
      transform-origin: left;
    }

    .arrows {
      position: absolute;
      top: 18.9%;
      left: 76.7%;
      display: flex;
      gap: 32px;
      transform: translate(-19px, -50%);
    }

    .arrow {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 2.5px solid #fff;
      background: transparent;
      color: #fff;
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: background .25s, color .25s;
    }

    .arrow svg { width: 18px; height: 18px; }
    .arrow:hover { background: #fff; color: #000; }

    .dots {
      position: absolute;
      right: calc(var(--pad-x) - 7px);
      top: 49.4%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 33px;
    }

    .dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 2px solid #fff;
      background: #fff;
      cursor: pointer;
      transition: background .25s;
    }

    .dot.active { background: transparent; }

    .tagline {
      position: absolute;
      left: var(--pad-x);
      bottom: clamp(40px, 7.5vh, 70px);
      margin: 0;
      font-size: clamp(24px, 2.65vw, 44px);
      line-height: 1.2;
      font-weight: 300;
      letter-spacing: -0.01em;
    }

    .tagline strong {
      display: block;
      font-weight: 700;
    }

    .cta-row {
      position: absolute;
      left: 45.6%;
      right: -1vw;
      top: 88.7%;
      transform: translateY(-50%);
      display: flex;
      align-items: center;
    }

    .cta {
      flex: none;
      padding: 0 15px;
      height: 48px;
      display: inline-flex;
      align-items: center;
      border: 1.5px solid rgba(255,255,255,.85);
      border-radius: 6px;
      background: rgba(0,0,0,.15);
      color: #fff;
      font-size: 14px;
      font-weight: 400;
      text-decoration: none;
      cursor: pointer;
      transition: background .25s, color .25s;
    }

    .cta:hover { background: #fff; color: #000; }

    .cta-line {
      flex: 1;
      height: 1.5px;
      background: rgba(255,255,255,.8);
      min-width: 40px;
    }

    .count {
      flex: none;
      font-size: clamp(140px, 19.8vw, 360px);
      font-weight: 400;
      line-height: 1;
      letter-spacing: -0.02em;
      color: transparent;
      -webkit-text-stroke: 1.5px rgba(255,255,255,.9);
      transform: translateY(6%);
      user-select: none;
    }

    .loader {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      font-size: 12px;
      letter-spacing: .2em;
      text-transform: uppercase;
      opacity: .6;
      transition: opacity .6s;
    }

    .loader.done { opacity: 0; }

    .arrow:focus-visible,
    .dot:focus-visible,
    .cta:focus-visible,
    .logo:focus-visible,
    .nav-links a:focus-visible {
      outline: 2px solid #fff;
      outline-offset: 4px;
    }

    @media (max-width: 900px), (max-aspect-ratio: 1/1) {
      .arrows {
        left: auto;
        right: var(--pad-x);
        top: 15%;
        transform: translateY(-50%);
        gap: 14px;
      }

      .tagline { bottom: clamp(150px, 20vh, 220px); }

      .cta-row {
        left: var(--pad-x);
        right: -3vw;
        top: auto;
        bottom: 24px;
        transform: none;
      }

      .count { font-size: clamp(120px, 22vw, 200px); }
    }

    @media (max-width: 640px) {
      .nav-links { gap: 16px; }
      .nav-links a, .logo { font-size: 13px; }
      .dots { gap: 20px; right: 16px; }
      .dot { width: 10px; height: 10px; }
      .cta-row { right: -8vw; }
      .count { font-size: 120px; }
    }

    @media (max-width: 420px) {
      .nav-links li:nth-child(2) { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      .nav-links a::after,
      .arrow,
      .dot,
      .cta,
      .loader { transition-duration: .01ms; }
    }
  </style>
</head>
<body>
  <section class="hero" id="hero">
    <canvas id="scene" aria-label="Rotatable glass cube. Drag to rotate."></canvas>
    <div class="ui">
      <h1 class="sr-only">Explore New Ideas</h1>
      <header class="nav">
        <a href="#hero" class="logo" aria-label="Design World home"><i class="logo-mark" aria-hidden="true"></i><b>Design</b><span>World</span></a>
        <ul class="nav-links"><li><a href="#hero">Home</a></li><li><a href="#hero">Portfolio</a></li><li><a href="#hero">Contact Us</a></li></ul>
      </header>
      <div class="arrows">
        <button class="arrow" id="prev" type="button" aria-label="Rotate cube left">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
        </button>
        <button class="arrow" id="next" type="button" aria-label="Rotate cube right">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </button>
      </div>
      <nav class="dots" aria-label="Slides"><button class="dot" type="button" aria-label="Slide 1"></button><button class="dot active" type="button" aria-label="Slide 2" aria-current="true"></button><button class="dot" type="button" aria-label="Slide 3"></button></nav>
      <p class="tagline">Let's Build the<br>Future of <strong>Design.</strong></p>
      <div class="cta-row">
        <a href="#hero" class="cta">Explore Now</a>
        <span class="cta-line"></span>
        <span class="count" aria-hidden="true">07</span>
      </div>
      <div class="loader" id="loader" role="status" aria-live="polite">Loading model</div>
    </div>
  </section>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { mergeVertices, mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
    import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

    const MODEL_URL = 'https://motionsites.org/assets/prompt-media/fa96096e78c8153a70d2.glb';

    const canvas = document.querySelector('#scene');
    const hero = document.querySelector('#hero');
    const loaderEl = document.querySelector('#loader');
    const prevButton = document.querySelector('#prev');
    const nextButton = document.querySelector('#next');
    const dots = [...document.querySelectorAll('.dot')];
    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
    renderer.setClearColor(0x000000, 1);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.NoToneMapping;

    const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 100);
    camera.position.set(0, 0, 10);
    camera.lookAt(0, 0, 0);

    const scene = new THREE.Scene();
    const pivot = new THREE.Group();
    const spinner = new THREE.Group();
    pivot.add(spinner);
    scene.add(pivot);
    spinner.rotation.set(-0.42, 0.62, 0.18);

    const bgScene = new THREE.Scene();
    const bgCamera = new THREE.Camera();
    const headlineCanvas = document.createElement('canvas');
    headlineCanvas.width = 2;
    headlineCanvas.height = 2;
    const headlineTexture = new THREE.CanvasTexture(headlineCanvas);
    headlineTexture.colorSpace = THREE.SRGBColorSpace;
    headlineTexture.minFilter = THREE.LinearFilter;
    headlineTexture.magFilter = THREE.LinearFilter;
    headlineTexture.generateMipmaps = false;

    const bgMaterial = new THREE.ShaderMaterial({
      uniforms: { uTex: { value: headlineTexture } },
      vertexShader: `
        varying vec2 vUv;
        void main() {
          vUv = uv;
          gl_Position = vec4(position.xy, 0.0, 1.0);
        }
      `,
      fragmentShader: `
        uniform sampler2D uTex;
        varying vec2 vUv;
        void main() {
          gl_FragColor = texture2D(uTex, vUv);
          #include <colorspace_fragment>
        }
      `,
      depthTest: false,
      depthWrite: false
    });
    const bgQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), bgMaterial);
    bgQuad.frustumCulled = false;
    bgScene.add(bgQuad);

    const vertexShader = `
      varying vec3 vNormal;
      varying vec3 vEye;

      void main() {
        vec4 worldPos = modelMatrix * vec4(position, 1.0);
        vec4 mvPos = viewMatrix * worldPos;
        gl_Position = projectionMatrix * mvPos;
        vNormal = normalize(normalMatrix * normal);
        vEye = normalize(mvPos.xyz);
      }
    `;

    const fragmentShader = `
      uniform sampler2D uTexture;
      uniform vec2 uResolution;
      uniform float uIorR;
      uniform float uIorY;
      uniform float uIorG;
      uniform float uIorC;
      uniform float uIorB;
      uniform float uIorP;
      uniform float uRefractPower;
      uniform float uChromatic;
      uniform float uSaturation;
      uniform float uShininess;
      uniform float uDiffuseness;
      uniform float uFresnelPower;
      uniform vec3 uLight;
      uniform float uBackside;

      varying vec3 vNormal;
      varying vec3 vEye;

      float specularLight(vec3 normal, vec3 eye, vec3 light, float shininess, float diffuseness) {
        vec3 lightVec = normalize(-light);
        vec3 viewVec = -eye;
        vec3 halfVec = normalize(lightVec + viewVec);
        return pow(max(dot(normal, halfVec), 0.0), shininess)
          + max(0.0, dot(normal, lightVec)) * diffuseness;
      }

      void main() {
        vec2 uv = gl_FragCoord.xy / uResolution;
        vec3 n = normalize(vNormal);
        if (uBackside > 0.5) n = -n;
        vec3 eye = normalize(vEye);
        vec3 color = vec3(0.0);
        const int LOOP = 16;

        for (int i = 0; i < LOOP; i++) {
          float slide = float(i) / float(LOOP) * 0.045;
          vec2 refrR = refract(eye, n, 1.0 / uIorR).xy;
          vec2 refrY = refract(eye, n, 1.0 / uIorY).xy;
          vec2 refrG = refract(eye, n, 1.0 / uIorG).xy;
          vec2 refrC = refract(eye, n, 1.0 / uIorC).xy;
          vec2 refrB = refract(eye, n, 1.0 / uIorB).xy;
          vec2 refrP = refract(eye, n, 1.0 / uIorP).xy;

          vec3 texR = texture2D(uTexture, uv + refrR * (uRefractPower + slide) * uChromatic).rgb;
          vec3 texY = texture2D(uTexture, uv + refrY * (uRefractPower + slide) * uChromatic).rgb;
          vec3 texG = texture2D(uTexture, uv + refrG * (uRefractPower + slide * 2.0) * uChromatic).rgb;
          vec3 texC = texture2D(uTexture, uv + refrC * (uRefractPower + slide * 2.5) * uChromatic).rgb;
          vec3 texB = texture2D(uTexture, uv + refrB * (uRefractPower + slide * 3.0) * uChromatic).rgb;
          vec3 texP = texture2D(uTexture, uv + refrP * (uRefractPower + slide) * uChromatic).rgb;

          float r = texR.r * 0.5;
          float y = (texY.r * 2.0 + texY.g * 2.0 - texY.b) / 6.0;
          float g = texG.g * 0.5;
          float c = (texC.g * 2.0 + texC.b * 2.0 - texC.r) / 6.0;
          float b = texB.b * 0.5;
          float p = (texP.b * 2.0 + texP.r * 2.0 - texP.g) / 6.0;

          float outR = r + (2.0 * p + 2.0 * y - c) / 3.0;
          float outG = g + (2.0 * y + 2.0 * c - p) / 3.0;
          float outB = b + (2.0 * c + 2.0 * p - y) / 3.0;
          color += vec3(outR, outG, outB);
        }

        color /= float(LOOP);
        float luma = dot(color, vec3(0.2125, 0.7154, 0.0721));
        color = mix(vec3(luma), color, uSaturation);

        float spec = specularLight(n, eye, uLight, uShininess, uDiffuseness)
          + 0.6 * specularLight(n, eye, vec3(1.0, 1.0, -1.0), uShininess * 0.6, uDiffuseness * 0.5);
        color += vec3(spec * (uBackside > 0.5 ? 0.35 : 1.0));

        float fresnel = pow(1.0 + dot(eye, n), uFresnelPower);
        color = mix(color, vec3(1.0), fresnel * (uBackside > 0.5 ? 0.25 : 0.55));
        color += vec3(0.004, 0.005, 0.007);
        gl_FragColor = vec4(color, 1.0);
        #include <colorspace_fragment>
      }
    `;

    const resolution = new THREE.Vector2(1, 1);

    function makeGlassMaterial(backside) {
      return new THREE.ShaderMaterial({
        uniforms: {
          uTexture: { value: null },
          uResolution: { value: resolution },
          uIorR: { value: 1.15 },
          uIorY: { value: 1.16 },
          uIorG: { value: 1.18 },
          uIorC: { value: 1.22 },
          uIorB: { value: 1.22 },
          uIorP: { value: 1.22 },
          uRefractPower: { value: backside ? 0.22 : 0.30 },
          uChromatic: { value: 0.5 },
          uSaturation: { value: 1.08 },
          uShininess: { value: 90.0 },
          uDiffuseness: { value: 0.02 },
          uFresnelPower: { value: 5.0 },
          uLight: { value: new THREE.Vector3(-1, 1, 1) },
          uBackside: { value: backside ? 1.0 : 0.0 }
        },
        vertexShader,
        fragmentShader,
        side: backside ? THREE.BackSide : THREE.FrontSide,
        depthTest: true,
        depthWrite: true
      });
    }

    const backMaterial = makeGlassMaterial(true);
    const frontMaterial = makeGlassMaterial(false);
    const rtOptions = {
      type: THREE.HalfFloatType,
      minFilter: THREE.LinearFilter,
      magFilter: THREE.LinearFilter,
      depthBuffer: true,
      stencilBuffer: false
    };
    const rtBack = new THREE.WebGLRenderTarget(1, 1, rtOptions);
    const rtFront = new THREE.WebGLRenderTarget(1, 1, rtOptions);
    backMaterial.uniforms.uTexture.value = rtBack.texture;
    frontMaterial.uniforms.uTexture.value = rtFront.texture;

    let cubeMesh = null;
    let viewWidth = 1;
    let viewHeight = 1;
    let pixelRatio = 1;
    let isMobile = false;

    function redrawHeadline() {
      const width = viewWidth;
      const height = viewHeight;
      const dpr = pixelRatio;
      headlineCanvas.width = Math.max(1, Math.round(width * dpr));
      headlineCanvas.height = Math.max(1, Math.round(height * dpr));
      const context = headlineCanvas.getContext('2d');
      context.setTransform(dpr, 0, 0, dpr, 0, 0);
      context.fillStyle = '#000';
      context.fillRect(0, 0, width, height);

      let fontSize = Math.min(height * 0.21, width * (isMobile ? 0.21 : 0.118));
      context.font = `800 ${fontSize}px Poppins, sans-serif`;
      const lines = ['Explore', 'New', 'Ideas'];
      const widest = Math.max(...lines.map((line) => context.measureText(line).width));
      const maxWidth = width * (isMobile ? 0.9 : 0.5);
      if (widest > maxWidth) fontSize *= maxWidth / widest;

      context.font = `800 ${fontSize}px Poppins, sans-serif`;
      context.fillStyle = '#e9e9e9';
      context.textAlign = 'center';
      context.textBaseline = 'alphabetic';
      const centerX = width * (isMobile ? 0.5 : 0.505);
      const centerY = height * (isMobile ? 0.45 : 0.468);
      const gap = fontSize * 1.07;
      const capHeight = fontSize * 0.7;
      lines.forEach((line, index) => {
        const baseline = centerY + capHeight / 2 + (index - 1) * gap;
        context.fillText(line, centerX, baseline);
      });
      headlineTexture.needsUpdate = true;
    }

    function layout() {
      const rect = hero.getBoundingClientRect();
      viewWidth = Math.max(1, Math.round(rect.width));
      viewHeight = Math.max(1, Math.round(rect.height));
      pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
      isMobile = viewWidth < 768 || viewWidth / viewHeight < 1;

      renderer.setPixelRatio(pixelRatio);
      renderer.setSize(viewWidth, viewHeight, false);
      camera.aspect = viewWidth / viewHeight;
      camera.updateProjectionMatrix();

      const bufferSize = renderer.getDrawingBufferSize(resolution);
      rtBack.setSize(bufferSize.x, bufferSize.y);
      rtFront.setSize(bufferSize.x, bufferSize.y);

      const visibleHeight = 2 * Math.tan(THREE.MathUtils.degToRad(camera.fov * 0.5)) * 10;
      const visibleWidth = visibleHeight * camera.aspect;
      const sx = isMobile ? 0.5 : 0.517;
      const sy = isMobile ? 0.45 : 0.488;
      pivot.position.set((sx - 0.5) * visibleWidth, (0.5 - sy) * visibleHeight, 0);
      const edgePixels = Math.min(viewHeight * 0.44, viewWidth * (isMobile ? 0.45 : 0.29));
      const scale = edgePixels / viewHeight * visibleHeight;
      pivot.scale.setScalar(scale);
      redrawHeadline();
    }

    function normalizeGeometry(geometry) {
      geometry.computeBoundingBox();
      if (!geometry.boundingBox) throw new Error('Model has no bounds.');
      const center = geometry.boundingBox.getCenter(new THREE.Vector3());
      const size = geometry.boundingBox.getSize(new THREE.Vector3());
      const largest = Math.max(size.x, size.y, size.z);
      if (!Number.isFinite(largest) || largest <= 0) throw new Error('Model bounds are invalid.');
      geometry.translate(-center.x, -center.y, -center.z);
      geometry.scale(1 / largest, 1 / largest, 1 / largest);
      geometry.computeBoundingBox();
      geometry.computeBoundingSphere();
      return geometry;
    }

    function extractGeometry(root) {
      root.updateMatrixWorld(true);
      const parts = [];
      root.traverse((object) => {
        if (!object.isMesh || !object.geometry?.attributes?.position) return;
        let geometry = object.geometry.clone();
        geometry.deleteAttribute('uv');
        geometry.deleteAttribute('color');
        geometry.deleteAttribute('tangent');
        const welded = mergeVertices(geometry, 1e-4);
        if (welded !== geometry) geometry.dispose();
        geometry = welded;
        geometry.computeVertexNormals();
        geometry.applyMatrix4(object.matrixWorld);
        parts.push(geometry);
      });

      if (!parts.length) throw new Error('Model contains no mesh geometry.');
      const merged = mergeGeometries(parts, false);
      parts.forEach((geometry) => geometry.dispose());
      if (!merged) throw new Error('Model geometry could not be merged.');
      return normalizeGeometry(merged);
    }

    function installGeometry(geometry, fallback = false) {
      if (cubeMesh) {
        spinner.remove(cubeMesh);
        cubeMesh.geometry.dispose();
      }
      cubeMesh = new THREE.Mesh(geometry, frontMaterial);
      cubeMesh.frustumCulled = false;
      spinner.add(cubeMesh);
      loaderEl.textContent = fallback ? 'Fallback model ready' : 'Loading model';
      loaderEl.classList.add('done');
      layout();
    }

    function installFallback() {
      installGeometry(new RoundedBoxGeometry(1, 1, 1, 8, 0.12), true);
    }

    new GLTFLoader().load(
      MODEL_URL,
      (gltf) => {
        try {
          installGeometry(extractGeometry(gltf.scene));
        } catch (error) {
          console.warn('The GLB could not be prepared; using the rounded-box fallback.', error);
          installFallback();
        }
      },
      undefined,
      (error) => {
        console.warn('The GLB could not be loaded; using the rounded-box fallback.', error);
        installFallback();
      }
    );

    const axisX = new THREE.Vector3(1, 0, 0);
    const axisY = new THREE.Vector3(0, 1, 0);
    const rotationX = new THREE.Quaternion();
    const rotationY = new THREE.Quaternion();

    function applyWorldRotation(deltaX, deltaY) {
      if (deltaX) {
        rotationY.setFromAxisAngle(axisY, deltaX);
        spinner.quaternion.premultiply(rotationY);
      }
      if (deltaY) {
        rotationX.setFromAxisAngle(axisX, deltaY);
        spinner.quaternion.premultiply(rotationX);
      }
    }

    let dragging = false;
    let activePointer = null;
    let lastPointerX = 0;
    let lastPointerY = 0;
    let lastPointerTime = 0;
    let velocityX = 0;
    let velocityY = 0;
    let spinRemaining = 0;
    let lastInteraction = performance.now();

    canvas.addEventListener('pointerdown', (event) => {
      if (activePointer !== null) return;
      activePointer = event.pointerId;
      dragging = true;
      velocityX = 0;
      velocityY = 0;
      spinRemaining = 0;
      lastPointerX = event.clientX;
      lastPointerY = event.clientY;
      lastPointerTime = event.timeStamp;
      lastInteraction = performance.now();
      canvas.setPointerCapture(event.pointerId);
      canvas.classList.add('dragging');
    });

    canvas.addEventListener('pointermove', (event) => {
      if (!dragging || event.pointerId !== activePointer) return;
      const elapsed = Math.max(1, event.timeStamp - lastPointerTime);
      const dx = (event.clientX - lastPointerX) * 0.008;
      const dy = (event.clientY - lastPointerY) * 0.008;
      applyWorldRotation(dx, dy);
      const frameRatio = 16.67 / elapsed;
      velocityX = dx * frameRatio;
      velocityY = dy * frameRatio;
      lastPointerX = event.clientX;
      lastPointerY = event.clientY;
      lastPointerTime = event.timeStamp;
      lastInteraction = performance.now();
    });

    function finishDrag(event) {
      if (event.pointerId !== activePointer) return;
      dragging = false;
      activePointer = null;
      lastInteraction = performance.now();
      canvas.classList.remove('dragging');
      if (canvas.hasPointerCapture(event.pointerId)) canvas.releasePointerCapture(event.pointerId);
    }

    canvas.addEventListener('pointerup', finishDrag);
    canvas.addEventListener('pointercancel', finishDrag);
    canvas.addEventListener('lostpointercapture', (event) => {
      if (event.pointerId !== activePointer) return;
      dragging = false;
      activePointer = null;
      lastInteraction = performance.now();
      canvas.classList.remove('dragging');
    });

    function queueQuarterTurn(direction) {
      velocityX = 0;
      velocityY = 0;
      spinRemaining += direction * Math.PI / 2;
      lastInteraction = performance.now();
    }

    prevButton.addEventListener('click', () => queueQuarterTurn(-1));
    nextButton.addEventListener('click', () => queueQuarterTurn(1));

    dots.forEach((dot) => {
      dot.addEventListener('click', () => {
        dots.forEach((item) => {
          const active = item === dot;
          item.classList.toggle('active', active);
          if (active) item.setAttribute('aria-current', 'true');
          else item.removeAttribute('aria-current');
        });
      });
    });

    document.querySelectorAll('a[href="#hero"]').forEach((link) => {
      link.addEventListener('click', (event) => event.preventDefault());
    });

    let resizeFrame = 0;
    function requestLayout() {
      if (resizeFrame) return;
      resizeFrame = requestAnimationFrame(() => {
        resizeFrame = 0;
        layout();
      });
    }

    window.addEventListener('resize', requestLayout, { passive: true });
    window.visualViewport?.addEventListener('resize', requestLayout, { passive: true });
    new ResizeObserver(requestLayout).observe(hero);
    document.fonts?.addEventListener('loadingdone', requestLayout);

    function renderFrame() {
      if (!cubeMesh) {
        renderer.setRenderTarget(null);
        renderer.autoClear = true;
        renderer.render(bgScene, bgCamera);
        return;
      }

      renderer.autoClear = true;
      renderer.setRenderTarget(rtBack);
      renderer.render(bgScene, bgCamera);

      renderer.setRenderTarget(rtFront);
      renderer.render(bgScene, bgCamera);
      renderer.autoClear = false;
      cubeMesh.material = backMaterial;
      renderer.render(scene, camera);

      renderer.setRenderTarget(null);
      renderer.autoClear = true;
      renderer.render(bgScene, bgCamera);
      renderer.autoClear = false;
      renderer.clearDepth();
      cubeMesh.material = frontMaterial;
      renderer.render(scene, camera);

      renderer.autoClear = true;
    }

    let previousTime = performance.now();
    function animate(now) {
      const dt = Math.min(0.05, Math.max(0, (now - previousTime) / 1000));
      previousTime = now;
      const frameScale = dt * 60;

      if (!dragging) {
        if (Math.abs(spinRemaining) >= 0.0005) {
          const step = spinRemaining * Math.min(1, 0.09 * frameScale);
          applyWorldRotation(step, 0);
          spinRemaining -= step;
        } else if (spinRemaining !== 0) {
          applyWorldRotation(spinRemaining, 0);
          spinRemaining = 0;
        } else if (Math.abs(velocityX) > 0.00001 || Math.abs(velocityY) > 0.00001) {
          if (reducedMotion.matches) {
            velocityX = 0;
            velocityY = 0;
          } else {
            applyWorldRotation(velocityX * frameScale, velocityY * frameScale);
            const damping = Math.pow(0.94, frameScale);
            velocityX *= damping;
            velocityY *= damping;
          }
        }

        if (!reducedMotion.matches && spinRemaining === 0) {
          const idleBlend = THREE.MathUtils.clamp((now - lastInteraction - 600) / 1000, 0, 1);
          if (idleBlend > 0) applyWorldRotation(0.0035 * frameScale * idleBlend, 0.0012 * frameScale * idleBlend);
        }
      }

      renderFrame();
      requestAnimationFrame(animate);
    }

    document.addEventListener('visibilitychange', () => {
      previousTime = performance.now();
    });

    Promise.race([
      Promise.all([
        document.fonts?.load('800 100px Poppins') ?? Promise.resolve(),
        document.fonts?.ready ?? Promise.resolve()
      ]),
      new Promise((resolve) => setTimeout(resolve, 2500))
    ]).finally(() => {
      layout();
      previousTime = performance.now();
      requestAnimationFrame(animate);
    });
  </script>
</body>
</html>
